name: Build KK Timeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore fast-timeline.sln
      - name: Build
        run: dotnet build fast-timeline.sln --configuration Release --no-restore
      - name: Package DLL and MIT license
        shell: pwsh
        run: ./release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: fast-timeline-${{ github.sha }}
          path: artifacts/fast_timeline_*.zip
          if-no-files-found: error
